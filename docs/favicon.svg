<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3" />
      <stop offset="35%" stop-color="#f0c75e" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c75e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Inner Specular Shield -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Sovereign Imperial Eagle & DA Monogram -->
  <g filter="url(#glow)">
    <!-- Imperial Crown / Eagle Crest Top -->
    <path d="M24 18 L32 13 L40 18 L36 21 L32 19 L28 21 Z" fill="url(#goldGrad)" />
    <circle cx="32" cy="11" r="1.5" fill="#fff5c0" />

    <!-- Stylized Sovereign Wings -->
    <path d="M12 25 C18 24, 25 28, 29 32 C26 31, 20 30, 14 34 C18 36, 23 37, 27 38 C23 40, 17 41, 16 45 C22 43, 27 41, 31 43 C31 43, 20 49, 18 52 C26 48, 30 46, 32 47" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <path d="M52 25 C46 24, 39 28, 35 32 C38 31, 44 30, 50 34 C46 36, 41 37, 37 38 C41 40, 47 41, 48 45 C42 43, 37 41, 33 43 C33 43, 44 49, 46 52 C38 48, 34 46, 32 47" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Diamond Core -->
    <polygon points="32,23 37,31 32,39 27,31" fill="url(#goldGrad)" />
    <polygon points="32,26 35,31 32,36 29,31" fill="#141824" />
    <circle cx="32" cy="31" r="1.5" fill="#fff5c0" />
  </g>
</svg>
